<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>作品 001</title>
  <meta name="description" content="NFC 作品展示页">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">PORTFOLIO</div>
      <div class="index">001 / 001</div>
    </header>

    <section class="hero">
      <img src="assets/cover.jpg" alt="作品主图">
    </section>

    <section class="intro">
      <div>
        <p class="eyebrow">PROJECT 001</p>
        <h1>帅气离孕续</h1>
      </div>

      <dl class="meta">
        <div><dt>类型</dt><dd>Photography</dd></div>
        <div><dt>年份</dt><dd>2026</dd></div>
        <div><dt>地点</dt><dd>Milano, Italy</dd></div>
        <div><dt>作者</dt><dd>吴牛逼</dd></div>
      </dl>
    </section>

    <section class="description">
      <p>
        这里填写作品简介。建议控制在 80–180 字，说明作品的主题、背景、材料、
        拍摄地点或设计概念。手机扫描 NFC 后，这一页会直接作为作品说明页打开。
      </p>
    </section>

    <section class="gallery">
      <div class="placeholder small"><span>assets/01.jpg</span></div>
      <div class="placeholder small"><span>assets/02.jpg</span></div>
      <!-- 上传图片后可以改成：
      <img src="assets/01.jpg" alt="作品图 1">
      <img src="assets/02.jpg" alt="作品图 2">
      -->
    </section>

    <footer>
      <span>NFC PORTFOLIO</span>
      <span>© 2026</span>
    </footer>
  </main>
</body>
</html>
